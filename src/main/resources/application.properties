spring.application.name=autoservice-backend

# PostgresSQL database configuration
spring.datasource.url=jdbc:postgresql://auto-service-db-server.postgres.database.azure.com:5432/auto-service
spring.datasource.username=test
spring.datasource.password=test@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT config
jwt.secret=mySuperSecretKeyThatIsAtLeast32CharactersLong
jwt.expiration=86400
